name: lint-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-test-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  EDUDSS_SKIP_DOTENV: "1"
  RUFF_VERSION: "0.14.5"
  # Số cảnh báo ruff còn lại được chấp nhận. Chỉ được GIẢM; sửa bớt cảnh báo thì hạ số này.
  RUFF_BASELINE: "457"

jobs:
  lint:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff==${RUFF_VERSION}"
      - name: Format check
        run: ruff format --check .
      - name: Lint (không vượt baseline)
        run: |
          count="$(ruff check --output-format json . | python -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          echo "ruff findings: ${count} (baseline ${RUFF_BASELINE})"
          ruff check --statistics . || true
          if [ "${count}" -gt "${RUFF_BASELINE}" ]; then
            echo "::error::ruff findings ${count} > baseline ${RUFF_BASELINE}"; exit 1
          fi
      - name: Undefined names / syntax errors (luôn phải bằng 0)
        run: ruff check --select F821,F822,F823,E9 .
      - name: Secret scan
        run: python tools/secret_scan.py .

  test:
    name: Pytest (không gồm e2e, load)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked dependencies
        run: |
          PIP_VERSION="$(sed -n 's/^# pip==//p' requirements.lock.txt | tr -d '\r')"
          python -m pip install "pip==${PIP_VERSION}"
          python -m pip install -r requirements.txt -c requirements.lock.txt
          # xgboost không kèm NCCL (chỉ dùng cho GPU), giống Dockerfile.
          python -m pip install --no-deps "$(grep -i '^xgboost==' requirements.lock.txt | tr -d '\r')"
      - name: Tests
        env:
          EDUDSS_DATA_ROOT: ${{ runner.temp }}/edudss-data
        run: python -m pytest tests --ignore=tests/e2e --ignore=tests/load -q -rfE -p no:cacheprovider
